# Releases, release-plz style: a bot PR accumulates the version bump and the
# changelog from conventional commits; merging that PR is the release act. The
# release job re-verifies everything, then waits in the crates-io environment
# for a manual approval before anything reaches the registry.
name: Release-plz
on:
  push:
    branches: [master]
permissions: {}
jobs:
  release-pr:
    name: Open or update the release PR
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'ironlark-dev'
    permissions: {} # the app token carries the writes; the default token gets none
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mint the app token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5.133
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
  release:
    name: Publish what master carries unpublished
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'ironlark-dev'
    environment: crates-io
    permissions: {} # the app token carries the writes; the default token gets none
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0
          rustup target add wasm32-wasip2
      - name: Battery
        run: |
          cargo fmt --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p ironlark --target wasm32-wasip2 -- -D warnings
      - name: Mint the app token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5.133
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
