# The whole local battery, on every merge request.
name: CI
on:
  pull_request:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Battery
    runs-on: ubuntu-24.04
    # Checkout only; nothing here writes back.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0
          rustup target add wasm32-wasip2
      - name: Format
        run: cargo fmt --check
      - name: Tests
        run: cargo test --workspace
      - name: Lints, native
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lints, wasm
        run: cargo clippy -p ironlark --target wasm32-wasip2 -- -D warnings
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p ironlark --no-deps
