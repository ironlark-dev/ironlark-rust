name: Publish
on:
  push:
    tags: ['v*.*.*']
permissions: {}
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'ironlark-dev'
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1
          rustup target add wasm32-wasip2
      - name: The tag names the version in the manifest
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not name version ${version}" >&2
            exit 1
          fi
      - name: Format
        run: cargo fmt --check
      - name: Test
        run: cargo test --workspace
      - name: Lint
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p ironlark --target wasm32-wasip2 -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc -p ironlark --no-deps
  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      id-token: write # the OIDC token crates.io exchanges for a publishing one
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Mint the registry token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish both crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{ section++; next } section == 1' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
