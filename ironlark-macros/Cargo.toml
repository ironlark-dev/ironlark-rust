[package]
name = "ironlark-macros"
description = "Procedural macros for the ironlark crate: protocol, hooks, declares and payload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
toml = { version = "1.1.4", default-features = false, features = ["parse"] }
# protox keeps protoc and any C++ toolchain out of the build
protox = { workspace = true }
# format off: prettyplease would lay out source this crate reparses anyway
prost-build = { workspace = true }
heck = "0.5"
