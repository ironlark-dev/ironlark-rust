[package]
name = "ironlark-macros"
description = "Procedural macros for the ironlark crate: protocol, hooks, declares and payload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
toml = { version = "1.1.4", default-features = false, features = ["parse"] }
# protox parses proto in Rust, so no protoc and no C++ toolchain enters the
# build of this crate or of a mod. It re-exports the prost-reflect the custom
# options are read through, which is what keeps the two versions in step.
protox = { workspace = true }
# `format` off: prost-build would pull prettyplease in to lay out source this
# crate immediately parses back into tokens.
prost-build = { workspace = true }
# The same case conversion prost applies to a message name, from the same
# version prost-build resolves.
heck = "0.5"
